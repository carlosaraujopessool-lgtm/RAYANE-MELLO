<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rayane Mello Estética</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>Rayane Mello Estética</h1>
  <p>Agende seu horário</p>
</header>

<div class="container">

  <div class="card">
    <h3>Serviço</h3>

    <select id="servico">
      <option>Extensão de Cílios</option>
      <option>Manutenção de Cílios</option>
      <option>Design de Sobrancelha</option>
      <option>Henna</option>
    </select>
  </div>

  <div class="card">
    <h3>Escolha data e horário</h3>

    <input type="date" id="data">

    <select id="hora">
      <option>08:00</option>
      <option>09:00</option>
      <option>10:00</option>
      <option>11:00</option>
      <option>13:00</option>
      <option>14:00</option>
      <option>15:00</option>
      <option>16:00</option>
    </select>
  </div>

  <div class="card">
    <h3>Seus dados</h3>

    <input type="text" id="nome" placeholder="Seu nome">

    <input type="tel" id="telefone" placeholder="WhatsApp">
  </div>

  <button onclick="agendar()">
    Agendar no WhatsApp
  </button>

</div>

<script src="script.js"></script>

</body>
</html>
